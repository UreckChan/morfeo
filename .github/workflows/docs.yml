name: Redirección a Vercel

# La documentación vive en Vercel (https://morfeo-docs-two.vercel.app). GitHub Pages solo redirige
# las direcciones viejas (ureckchan.github.io/morfeo/...) a la página equivalente.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Página de redirección
        run: |
          mkdir sitio
          cat > sitio/index.html <<'HTML'
          <!doctype html><html lang="es"><head><meta charset="utf-8">
          <title>Morfeo se mudó</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://morfeo-docs-two.vercel.app/">
          <script>
            var p = location.pathname.replace(/^\/morfeo/, '').replace(/\.html$/, '') || '/';
            if (p === '/novedades') p = '/historial';
            location.replace('https://morfeo-docs-two.vercel.app' + p + location.search + location.hash);
          </script>
          <meta http-equiv="refresh" content="0; url=https://morfeo-docs-two.vercel.app/">
          </head><body><p>La documentación de Morfeo ahora está en <a href="https://morfeo-docs-two.vercel.app/">https://morfeo-docs-two.vercel.app</a>.</p></body></html>
          HTML
          cp sitio/index.html sitio/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
